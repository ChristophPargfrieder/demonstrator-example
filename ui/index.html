<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel desk</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.5 system-ui, sans-serif;
      color: #17231e;
      background: #f3f5f1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem max(1rem, calc((100% - 1120px) / 2));
      color: #fff;
      background: #173c30;
    }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: .15rem; font-size: 1.5rem; }
    header p { margin: 0; color: #c6d9cd; }
    button, input, select { font: inherit; }
    button {
      border: 0;
      border-radius: .5rem;
      padding: .65rem .9rem;
      color: #fff;
      background: #24654d;
      cursor: pointer;
    }
    button:hover { background: #184d38; }
    button.secondary { color: #214638; background: #e6eee8; }
    button.secondary:hover { background: #d3e2d8; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    main { max-width: 1120px; margin: 1.5rem auto; padding: 0 1rem; }
    #notice { min-height: 1.5rem; margin-bottom: .75rem; color: #315343; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    section {
      min-width: 0;
      padding: 1.1rem;
      border: 1px solid #dfe5de;
      border-radius: .8rem;
      background: #fff;
      box-shadow: 0 2px 8px #17231e0a;
    }
    section.wide { grid-column: 1 / -1; }
    h2 { margin-bottom: 1rem; font-size: 1.1rem; }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    label { display: grid; gap: .3rem; font-size: .88rem; font-weight: 600; }
    input, select {
      width: 100%;
      min-width: 0;
      padding: .6rem;
      border: 1px solid #cbd6ce;
      border-radius: .45rem;
      background: #fff;
    }
    form button { grid-column: 1 / -1; justify-self: start; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: .7rem .5rem; border-bottom: 1px solid #e8ede8; white-space: nowrap; }
    th { color: #627168; font-size: .8rem; }
    td.actions { display: flex; gap: .4rem; }
    td.actions button { padding: .4rem .6rem; font-size: .85rem; }
    .empty { color: #68766e; }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      section.wide { grid-column: auto; }
      header { align-items: flex-start; }
      form { grid-template-columns: 1fr; }
      form button { grid-column: auto; }
      td.actions { white-space: normal; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Hotel desk</h1>
      <p>Rooms, guests, and reservations</p>
    </div>
    <button id="refresh" class="secondary" type="button">Refresh</button>
  </header>
  <main>
    <p id="notice" role="status" aria-live="polite">Connecting to the service…</p>
    <div class="grid">
      <section>
        <h2>Add a room</h2>
        <form id="room-form">
          <label>Room number<input name="room_number" required maxlength="20"></label>
          <label>Room type<input name="room_type" required maxlength="50" placeholder="Queen"></label>
          <label>Capacity<input name="capacity" type="number" min="1" max="20" value="2" required></label>
          <label>Nightly rate<input name="nightly_rate" type="number" min="0" step="0.01" required></label>
          <button type="submit">Add room</button>
        </form>
      </section>
      <section>
        <h2>Register a guest</h2>
        <form id="guest-form">
          <label>First name<input name="first_name" required maxlength="100"></label>
          <label>Last name<input name="last_name" required maxlength="100"></label>
          <label>Email<input name="email" type="email" required maxlength="254"></label>
          <label>Phone<input name="phone" type="tel" maxlength="30"></label>
          <button type="submit">Add guest</button>
        </form>
      </section>
      <section class="wide">
        <h2>Book a stay</h2>
        <form id="reservation-form">
          <label>Room<select name="room_id" required></select></label>
          <label>Guest<select name="guest_id" required></select></label>
          <label>Check-in<input name="check_in" type="date" required></label>
          <label>Check-out<input name="check_out" type="date" required></label>
          <label>Guests<input name="guest_count" type="number" min="1" max="20" value="1" required></label>
          <button id="book-button" type="submit">Book room</button>
        </form>
      </section>
      <section class="wide">
        <h2>Reservations</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Guest</th><th>Room</th><th>Stay</th><th>Guests</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="reservation-list"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script>
    const api = "/api";
    const notice = document.querySelector("#notice");
    const roomSelect = document.querySelector('[name="room_id"]');
    const guestSelect = document.querySelector('[name="guest_id"]');
    const bookButton = document.querySelector("#book-button");

    async function request(path, options = {}) {
      const response = await fetch(`${api}${path}`, {
        ...options,
        headers: { ...(options.body ? { "Content-Type": "application/json" } : {}), ...options.headers },
      });
      if (!response.ok) {
        let detail = `Request failed (${response.status})`;
        try {
          const body = await response.json();
          if (body.detail) detail = body.detail;
        } catch { /* Keep the HTTP status message when the response is not JSON. */ }
        throw new Error(detail);
      }
      return response.status === 204 ? null : response.json();
    }

    function showMessage(message) {
      notice.textContent = message;
    }

    function cell(row, value) {
      const item = document.createElement("td");
      item.textContent = value;
      row.append(item);
      return item;
    }

    function fillSelect(select, items, labelFor, placeholder) {
      select.replaceChildren();
      const first = document.createElement("option");
      first.value = "";
      first.textContent = placeholder;
      select.append(first);
      for (const item of items) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = labelFor(item);
        select.append(option);
      }
      select.disabled = items.length === 0;
    }

    function renderReservations(reservations) {
      const list = document.querySelector("#reservation-list");
      list.replaceChildren();
      if (reservations.length === 0) {
        const row = document.createElement("tr");
        const empty = cell(row, "No reservations yet");
        empty.colSpan = 6;
        empty.className = "empty";
        list.append(row);
        return;
      }
      for (const reservation of reservations) {
        const row = document.createElement("tr");
        cell(row, `${reservation.first_name} ${reservation.last_name}`);
        cell(row, `Room ${reservation.room_number}`);
        cell(row, `${reservation.check_in} – ${reservation.check_out}`);
        cell(row, String(reservation.guest_count));
        cell(row, reservation.status.replace("_", " "));
        const actions = document.createElement("td");
        actions.className = "actions";
        const next = reservation.status === "booked"
          ? [["Check in", "checked_in"], ["Cancel", "cancelled"]]
          : reservation.status === "checked_in" ? [["Check out", "checked_out"]] : [];
        for (const [label, status] of next) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "secondary";
          button.textContent = label;
          button.addEventListener("click", () => changeStatus(reservation.id, status));
          actions.append(button);
        }
        row.append(actions);
        list.append(row);
      }
    }

    async function loadDashboard() {
      try {
        await request("/health");
        const [rooms, guests, reservations] = await Promise.all([
          request("/rooms"),
          request("/guests"),
          request("/reservations"),
        ]);
        fillSelect(
          roomSelect,
          rooms.filter(room => room.is_active),
          room => `${room.room_number} — ${room.room_type} (up to ${room.capacity})`,
          rooms.some(room => room.is_active) ? "Choose a room" : "Add an active room first",
        );
        fillSelect(
          guestSelect,
          guests,
          guest => `${guest.first_name} ${guest.last_name} (${guest.email})`,
          guests.length ? "Choose a guest" : "Register a guest first",
        );
        bookButton.disabled = roomSelect.disabled || guestSelect.disabled;
        renderReservations(reservations);
        showMessage(`Service connected · ${rooms.length} rooms · ${guests.length} guests`);
      } catch (error) {
        showMessage(`Service unavailable: ${error.message}`);
      }
    }

    async function runAction(action, successMessage) {
      try {
        await action();
        await loadDashboard();
        showMessage(successMessage);
        return true;
      } catch (error) {
        showMessage(`Could not complete the request: ${error.message}`);
        return false;
      }
    }

    async function changeStatus(id, status) {
      await runAction(
        () => request(`/reservations/${id}/status`, {
          method: "PATCH",
          body: JSON.stringify({ status }),
        }),
        `Reservation ${status.replace("_", " ")}.`,
      );
    }

    document.querySelector("#room-form").addEventListener("submit", event => {
      event.preventDefault();
      const formElement = event.currentTarget;
      const formData = new FormData(formElement);
      runAction(
        () => request("/rooms", {
          method: "POST",
          body: JSON.stringify({
            room_number: formData.get("room_number"),
            room_type: formData.get("room_type"),
            capacity: Number(formData.get("capacity")),
            nightly_rate: Number(formData.get("nightly_rate")),
          }),
        }),
        "Room added.",
      ).then(success => {
        if (success) formElement.reset();
      });
    });

    document.querySelector("#guest-form").addEventListener("submit", event => {
      event.preventDefault();
      const formElement = event.currentTarget;
      const formData = new FormData(formElement);
      runAction(
        () => request("/guests", {
          method: "POST",
          body: JSON.stringify({
            first_name: formData.get("first_name"),
            last_name: formData.get("last_name"),
            email: formData.get("email"),
            phone: formData.get("phone") || null,
          }),
        }),
        "Guest registered.",
      ).then(success => {
        if (success) formElement.reset();
      });
    });

    document.querySelector("#reservation-form").addEventListener("submit", event => {
      event.preventDefault();
      const formElement = event.currentTarget;
      const formData = new FormData(formElement);
      runAction(
        () => request("/reservations", {
          method: "POST",
          body: JSON.stringify({
            room_id: Number(formData.get("room_id")),
            guest_id: Number(formData.get("guest_id")),
            check_in: formData.get("check_in"),
            check_out: formData.get("check_out"),
            guest_count: Number(formData.get("guest_count")),
          }),
        }),
        "Reservation created.",
      ).then(success => {
        if (success) formElement.reset();
      });
    });

    document.querySelector("#refresh").addEventListener("click", loadDashboard);
    loadDashboard();
  </script>
</body>
</html>
