services:
  service:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      DATABASE_PATH: /data/hotel.db
    volumes:
      - hotel-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    depends_on:
      service:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  hotel-data:
